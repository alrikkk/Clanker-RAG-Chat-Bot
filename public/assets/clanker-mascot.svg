<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" aria-label="Clanker Robot Mascot">
  <defs>
    <!-- Metallic & Leather Gradients -->
    <radialGradient id="metal-sphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="45%" stop-color="#9ca3af"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <linearGradient id="brass-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <linearGradient id="visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>

    <radialGradient id="amber-meter" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="eye-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Antenna Rig -->
    <rect x="96" y="16" width="8" height="24" rx="3" fill="url(#brass-gold)" stroke="#713f12" stroke-width="1.5"/>
    <circle cx="100" cy="14" r="8" fill="url(#cyan-glow)" filter="url(#eye-glow)"/>
    <circle cx="100" cy="14" r="4" fill="#ffffff" opacity="0.8"/>
    <!-- Antenna Coils -->
    <ellipse cx="100" cy="24" rx="8" ry="2.5" fill="none" stroke="#713f12" stroke-width="2"/>
    <ellipse cx="100" cy="30" rx="6" ry="2" fill="none" stroke="#713f12" stroke-width="2"/>

    <!-- Ears / Side Bolts -->
    <rect x="36" y="68" width="12" height="26" rx="4" fill="url(#brass-gold)" stroke="#451a03" stroke-width="1.5"/>
    <circle cx="42" cy="81" r="3" fill="#1e293b"/>
    
    <rect x="152" y="68" width="12" height="26" rx="4" fill="url(#brass-gold)" stroke="#451a03" stroke-width="1.5"/>
    <circle cx="158" cy="81" r="3" fill="#1e293b"/>

    <!-- Main Robot Head (Beveled CRT / Mechanical Helmet) -->
    <rect x="44" y="38" width="112" height="92" rx="24" fill="url(#metal-sphere)" stroke="#334155" stroke-width="3"/>
    
    <!-- Outer Bezel / Rivets -->
    <circle cx="56" cy="50" r="2.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <circle cx="144" cy="50" r="2.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <circle cx="56" cy="118" r="2.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <circle cx="144" cy="118" r="2.5" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>

    <!-- Face Plate Screen (Dark Inset Monitor) -->
    <rect x="54" y="50" width="92" height="66" rx="14" fill="url(#visor-glass)" stroke="#0f172a" stroke-width="2"/>

    <!-- Screen Glare Reflection -->
    <path d="M 58 54 L 100 54 L 70 108 L 58 108 Z" fill="#ffffff" opacity="0.07"/>

    <!-- Cyan Glowing Robotic Eyes -->
    <g filter="url(#eye-glow)">
      <!-- Left Eye -->
      <rect x="68" y="66" width="22" height="14" rx="6" fill="url(#cyan-glow)"/>
      <circle cx="79" cy="73" r="3" fill="#ffffff"/>
      
      <!-- Right Eye -->
      <rect x="110" y="66" width="22" height="14" rx="6" fill="url(#cyan-glow)"/>
      <circle cx="121" cy="73" r="3" fill="#ffffff"/>
    </g>

    <!-- Mechanical Grille / Speaker Teeth -->
    <g fill="#334155" stroke="#0f172a" stroke-width="1">
      <rect x="76" y="94" width="6" height="12" rx="2" fill="url(#brass-gold)"/>
      <rect x="86" y="94" width="6" height="12" rx="2" fill="url(#brass-gold)"/>
      <rect x="97" y="94" width="6" height="12" rx="2" fill="url(#brass-gold)"/>
      <rect x="108" y="94" width="6" height="12" rx="2" fill="url(#brass-gold)"/>
      <rect x="118" y="94" width="6" height="12" rx="2" fill="url(#brass-gold)"/>
    </g>

    <!-- Neck Connector -->
    <rect x="84" y="130" width="32" height="14" rx="3" fill="url(#brass-gold)" stroke="#713f12" stroke-width="2"/>
    <line x1="90" y1="130" x2="90" y2="144" stroke="#451a03" stroke-width="2"/>
    <line x1="100" y1="130" x2="100" y2="144" stroke="#451a03" stroke-width="2"/>
    <line x1="110" y1="130" x2="110" y2="144" stroke="#451a03" stroke-width="2"/>

    <!-- Chestplate / Industrial Base -->
    <path d="M 52 144 L 148 144 L 162 188 L 38 188 Z" fill="url(#metal-sphere)" stroke="#334155" stroke-width="3"/>

    <!-- Brass Trim on Chest -->
    <path d="M 52 144 L 148 144" stroke="url(#brass-gold)" stroke-width="4" stroke-linecap="round"/>

    <!-- Analog Audio / RAG Gauge on Chest -->
    <circle cx="100" cy="168" r="14" fill="url(#amber-meter)" stroke="#713f12" stroke-width="2"/>
    <!-- Gauge Meter Needle -->
    <line x1="100" y1="174" x2="108" y2="160" stroke="#991b1b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="174" r="3" fill="#451a03"/>
    
    <!-- Status LEDs on Chest -->
    <circle cx="68" cy="166" r="3.5" fill="#22c55e" filter="url(#eye-glow)"/>
    <circle cx="68" cy="176" r="3.5" fill="#eab308"/>
    <circle cx="132" cy="166" r="3.5" fill="#3b82f6"/>
    <circle cx="132" cy="176" r="3.5" fill="#ef4444"/>
  </g>
</svg>
